name: grovsil

on:
  schedule:
    - cron: "50 21 * * 1-5"   # etter at USA stenger (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python test_screen.py
      - name: Sil aksjene
        id: sil
        run: |
          set +e
          python screen.py out/screen.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
      - name: Publiser screen.json på grenen screen
        if: steps.sil.outputs.code == '0'
        working-directory: out
        run: |
          git init -q -b screen
          git config user.name "amy-kurser"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screen.json
          git commit -qm "grovsil $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screen
